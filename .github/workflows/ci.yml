name: CI

on:
  push:
    branches: [main]
    paths: ["app/**", "supabase/**", ".github/**"]
  pull_request:
  workflow_dispatch:

jobs:
  base-de-datos:
    name: Esquema Supabase (pruebas)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - run: bash supabase/tests/run.sh

  flutter:
    name: Flutter (pruebas y APK)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      # el repo guarda solo lib/, test/ y pubspec: las carpetas de plataforma las genera Flutter
      - name: Generar carpeta android
        run: |
          flutter create --platforms=android --org com.fercho --project-name cuentas_claras .
          rm -f test/widget_test.dart
      - run: bash ../.github/ci_run.sh flutter pub get
      - run: bash ../.github/ci_run.sh flutter analyze --no-fatal-infos
      - run: bash ../.github/ci_run.sh flutter test
      - name: Compilar APK
        run: bash ../.github/ci_run.sh flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: cuentas-claras-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk

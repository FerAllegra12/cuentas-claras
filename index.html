<meta name="claude:viewport-fit-sides" content="cover">
<title>Cuentas Claras</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap">
<style>
/* Layout: columna única pensada para el celular (barra de pestañas abajo); en pantallas anchas la misma columna centrada.
   Identidad: papel verdoso y tinta oscura, un solo verde profundo como acento, números grandes en Space Grotesk. */
:root {
  --bg: #F1F5F3;
  --surface: #FFFFFF;
  --surface-2: #E8EFEC;
  --ink: #14201C;
  --muted: #55665F;
  --line: #D6DFDB;
  --accent: #0E6B58;
  --accent-ink: #FFFFFF;
  --accent-soft: #D7EEE6;
  --warn: #8A5200;
  --warn-soft: #FBEACB;
  --bad: #B3261E;
  --bad-soft: #FBE0DD;
  --good: #176B3B;
  --good-soft: #D6EFDD;
  --font-text: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --font-display: 'Space Grotesk', 'Inter', system-ui, sans-serif;
  --font-mono: ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
  --r: 14px;
  --gutter-l: max(16px, env(safe-area-inset-left, 0px));
  --gutter-r: max(16px, env(safe-area-inset-right, 0px));
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0D1412; --surface: #151E1B; --surface-2: #1D2825; --ink: #E5EFEB; --muted: #90A59C; --line: #28352F;
    --accent: #5FD0B2; --accent-ink: #06201A; --accent-soft: #163A30;
    --warn: #F0B84A; --warn-soft: #3A2D10; --bad: #FF8F86; --bad-soft: #40201D; --good: #6FD39A; --good-soft: #143323;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0D1412; --surface: #151E1B; --surface-2: #1D2825; --ink: #E5EFEB; --muted: #90A59C; --line: #28352F;
  --accent: #5FD0B2; --accent-ink: #06201A; --accent-soft: #163A30;
  --warn: #F0B84A; --warn-soft: #3A2D10; --bad: #FF8F86; --bad-soft: #40201D; --good: #6FD39A; --good-soft: #143323;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font-text); font-size: 15px; line-height: 1.45;
  padding-left: var(--gutter-l); padding-right: var(--gutter-r); padding-block: 0;
}
button, input, select, textarea { font: inherit; color: inherit; }
h1, h2, h3, p { margin: 0; }
h1, h2, h3 { font-family: var(--font-display); text-wrap: balance; }
.num, .row-amt, .stat b, .hero b { font-family: var(--font-display); font-variant-numeric: tabular-nums; }
.mono { font-family: var(--font-mono); font-size: 12px; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

#shell { max-width: 720px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; padding-block: 16px 96px; min-width: 0; }
.top { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 12px; }
.brand { display: flex; align-items: baseline; gap: 10px; min-width: 0; }
.brand h1 { font-size: 24px; font-weight: 700; letter-spacing: -0.01em; }
.tag { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 2px 8px; }
.month { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--muted); }
.month select { min-width: 190px; }
#view { display: flex; flex-direction: column; gap: 16px; min-width: 0; }

/* controles */
input[type=text], input[type=email], input[type=number], input[type=month], select, textarea {
  width: 100%; min-height: 44px; padding: 9px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); font-size: 16px; min-width: 0;
}
input::placeholder { color: color-mix(in srgb, var(--muted) 75%, transparent); }
label.f { display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: var(--muted); min-width: 0; }
label.chk { display: flex; align-items: center; gap: 10px; font-size: 15px; color: var(--ink); min-height: 44px; }
label.chk input { width: 20px; height: 20px; accent-color: var(--accent); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 0 16px; border-radius: 10px; border: 1px solid transparent; background: var(--accent); color: var(--accent-ink); font-weight: 600; cursor: pointer; }
.btn:hover { filter: brightness(1.06); }
.btn:disabled { opacity: .45; cursor: not-allowed; filter: none; }
.btn.ghost { background: transparent; color: var(--ink); border-color: var(--line); }
.btn.ghost:hover { background: var(--surface-2); filter: none; }
.btn.danger { background: transparent; color: var(--bad); border-color: color-mix(in srgb, var(--bad) 45%, var(--line)); }
.btn.small { min-height: 36px; padding: 0 12px; font-size: 14px; }
.btns { display: flex; flex-wrap: wrap; gap: 10px; }

/* piezas */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.card.flat { padding: 0; gap: 0; overflow: hidden; }
.sec-h { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.sec-h h2 { font-size: 17px; font-weight: 600; }
.sec-h span { font-size: 13px; color: var(--muted); }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.hero { background: var(--accent); color: var(--accent-ink); border-radius: var(--r); padding: 18px 18px 20px; display: flex; flex-direction: column; gap: 4px; }
.hero small { font-size: 13px; opacity: .85; }
.hero b { font-size: clamp(32px, 9vw, 44px); line-height: 1.05; font-weight: 700; letter-spacing: -0.02em; }
.hero .usd { font-family: var(--font-display); font-size: 18px; opacity: .9; }
.stats { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.stat small { color: var(--muted); font-size: 13px; }
.stat b { font-size: 20px; font-weight: 600; white-space: nowrap; }
.stat b .usd, .row-amt .usd { display: block; font-size: 13px; font-weight: 500; color: var(--muted); }
.hero b .usd { display: block; }
[hidden] { display: none !important; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { display: inline-flex; align-items: center; font-size: 12px; font-weight: 500; line-height: 1; padding: 5px 8px; border-radius: 999px; background: var(--surface-2); color: var(--muted); white-space: nowrap; }
.chip-split { background: var(--accent-soft); color: var(--accent); }
.chip-end { background: var(--warn-soft); color: var(--warn); }
.chip-edit { cursor: pointer; text-decoration: underline dotted; text-underline-offset: 3px; }
.row-amt-edit { cursor: pointer; text-decoration: underline dotted; text-decoration-color: var(--muted); text-underline-offset: 4px; }
.chip-warn { background: var(--warn-soft); color: var(--warn); border: 1px dashed currentColor; }
.hero.debt { background: var(--bad-soft); color: var(--bad); }
.gear { margin-left: 2px; width: 36px; height: 36px; display: inline-grid; place-items: center; border: 1px solid var(--line); background: var(--surface); color: var(--muted); border-radius: 10px; cursor: pointer; align-self: center; }
.gear svg { width: 20px; height: 20px; }
.gear[aria-pressed="true"] { color: var(--accent); border-color: var(--accent); }
.chkset { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; display: flex; flex-wrap: wrap; gap: 6px 16px; min-width: 0; }
.chkset legend { font-size: 13px; color: var(--muted); padding: 0 6px; }
.chk { display: inline-flex; align-items: center; gap: 8px; font-size: 15px; min-height: 36px; }
.chk input { width: 20px; height: 20px; accent-color: var(--accent); }
.row-amt.owe { color: var(--bad); }
.sec-title { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-top: 8px; padding: 0 2px; }
.sec-title h2 { font-size: 20px; font-weight: 700; letter-spacing: -0.01em; }
.sec-title span { font-size: 13px; color: var(--muted); }
.owe-t { color: var(--bad); }
.row.pay { background: var(--good-soft); }
.row.pay .row-title { color: var(--good); }
.ck { width: 18px; height: 18px; vertical-align: -3px; margin-right: 6px; color: var(--good); flex: none; }
.settled { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; border: 0; background: var(--accent); color: var(--accent-ink); padding: 14px 16px; cursor: pointer; font: inherit; }
.settled .ck { width: 26px; height: 26px; margin: 0; color: var(--accent-ink); }
.settled b { font-family: var(--font-display); font-size: 17px; }
.settled .meta { color: inherit; opacity: .9; }
.settled > div { flex: 1; min-width: 0; }
.nest { margin-left: 14px; border-left: 3px solid var(--accent); }
.row.pend { background: var(--warn-soft); }
.gain { color: var(--good); font-weight: 600; }
.owe { color: var(--bad); font-weight: 600; }
.settled .chev { width: 20px; height: 20px; flex: none; transition: transform .15s; }
.settled[aria-expanded="true"] .chev { transform: rotate(180deg); }
.list.old { background: color-mix(in srgb, var(--surface) 92%, var(--muted)); }
.hist summary { cursor: pointer; font-weight: 600; }
.act .row { align-items: flex-start; }
.chip-bad { background: var(--bad-soft); color: var(--bad); }
.chip-good { background: var(--good-soft); color: var(--good); }

.list { display: flex; flex-direction: column; }
.row { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; width: 100%; padding: 12px 16px; background: transparent; border: 0; border-top: 1px solid var(--line); text-align: left; cursor: pointer; min-width: 0; }
.row:first-child { border-top: 0; }
button.row:hover { background: var(--surface-2); }
.row-main { display: flex; flex-direction: column; gap: 6px; min-width: 0; flex: 1; }
.row-title { font-weight: 500; overflow-wrap: anywhere; }
.row-amt { font-weight: 600; white-space: nowrap; text-align: right; }
.row-amt.neg { color: var(--good); }
.meta { color: var(--muted); font-size: 12px; overflow-wrap: anywhere; }
.group-h { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; padding: 12px 16px; background: var(--surface-2); font-size: 13px; color: var(--muted); }
.group-h b { color: var(--ink); font-family: var(--font-display); font-size: 14px; }
details.person { border-top: 1px solid var(--line); }
details.person:first-child { border-top: 0; }
details.person > summary { list-style: none; display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 14px 16px; cursor: pointer; min-height: 52px; }
details.person > summary::-webkit-details-marker { display: none; }
details.person > summary::after { content: '›'; color: var(--muted); font-size: 20px; transform: rotate(90deg); transition: transform .15s; margin-left: 4px; }
details.person[open] > summary::after { transform: rotate(-90deg); }
.person-name { font-weight: 600; font-size: 16px; }
.person-sub { display: flex; align-items: center; gap: 10px; }
details.person .list { background: var(--bg); }
.empty { text-align: center; padding: 28px 18px; display: flex; flex-direction: column; align-items: center; gap: 12px; }
.empty h2 { font-size: 20px; }
.empty p { color: var(--muted); max-width: 44ch; }

.seg { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; padding: 4px; background: var(--surface-2); border-radius: 12px; }
.seg button { min-height: 40px; border: 0; border-radius: 9px; background: transparent; color: var(--muted); font-weight: 600; cursor: pointer; }
.seg button[aria-pressed=true] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.08); }
.filters { display: flex; flex-wrap: wrap; gap: 8px; }
.fchip { min-height: 36px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); font-size: 14px; cursor: pointer; }
.fchip[aria-pressed=true] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }

.dz { position: relative; border: 2px dashed color-mix(in srgb, var(--accent) 55%, var(--line)); border-radius: var(--r); background: var(--surface); padding: 26px 18px; display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center; cursor: pointer; }
.dz.over { background: var(--accent-soft); }
.dz b { font-family: var(--font-display); font-size: 18px; }
.dz input { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
.alert { border-radius: 10px; padding: 12px 14px; font-size: 14px; display: flex; flex-direction: column; gap: 6px; }
.alert.bad { background: var(--bad-soft); color: var(--bad); }
.alert.warn { background: var(--warn-soft); color: var(--warn); }
.alert.good { background: var(--good-soft); color: var(--good); }
.alert ul { margin: 0; padding-left: 18px; }
.ask { border: 1px solid color-mix(in srgb, var(--warn) 40%, var(--line)); background: var(--warn-soft); color: var(--ink); border-radius: 10px; padding: 12px 14px; display: flex; flex-direction: column; gap: 10px; font-size: 14px; }

.rv { gap: 14px; }
.rv-head { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px 12px; align-items: baseline; }
.rv-head h3 { font-size: 18px; }
.rv-item { display: flex; flex-direction: column; gap: 10px; padding: 14px 16px; border-top: 1px solid var(--line); min-width: 0; }
.rv-item:first-child { border-top: 0; }
.rv-top { display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; }
.rv-ctrls { display: grid; grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); gap: 10px; }
.form-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.form-grid .wide { grid-column: 1 / -1; }
.err { color: var(--bad); }

/* navegación inferior */
.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: color-mix(in srgb, var(--surface) 94%, transparent); backdrop-filter: blur(8px); border-top: 1px solid var(--line); padding: 6px var(--gutter-r) calc(6px + env(safe-area-inset-bottom, 0px)) var(--gutter-l); }
.tabs-in { max-width: 720px; margin: 0 auto; display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 2px; }
.tab { display: flex; flex-direction: column; align-items: center; gap: 3px; min-height: 52px; justify-content: center; border: 0; background: transparent; color: var(--muted); font-size: 11px; font-weight: 500; border-radius: 10px; cursor: pointer; }
.tab { position: relative; }
.whochip { display: inline-flex; gap: 4px; align-items: center; border: 1px dashed var(--line); background: var(--surface-2); color: var(--muted); font-size: 12px; padding: 5px 10px; border-radius: 999px; cursor: pointer; margin-bottom: 12px; }
.whochip b { color: var(--fg); }
.who-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; padding: 8px 16px 16px; }
.who { display: flex; flex-direction: column; gap: 3px; text-align: left; padding: 12px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); color: var(--fg); cursor: pointer; min-width: 0; }
.who span { font-size: 12px; color: var(--muted); overflow-wrap: anywhere; }
.who[aria-pressed=true] { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
.who[aria-pressed=true] b::after { content: ' ✓'; color: var(--accent); }
.tab svg { width: 22px; height: 22px; }
.tab-badge { position: absolute; top: 4px; left: calc(50% + 6px); min-width: 16px; height: 16px; border-radius: 999px; background: #f59e0b; color: #1b1300; font-size: 11px; font-weight: 700; line-height: 16px; text-align: center; }
.qmark { display: inline-flex; align-items: center; justify-content: center; width: 20px; height: 20px; border-radius: 999px; background: #f59e0b; color: #1b1300; font-size: 13px; font-weight: 700; }
.todo { border-color: #f59e0b; }
.tab[aria-current=page] { color: var(--accent); }
.tab[aria-current=page] svg { stroke-width: 2.2; }

/* modal y aviso */
#modalRoot:empty { display: none; }
.scrim { position: fixed; inset: 0; z-index: 40; background: rgba(8, 14, 12, .55); display: flex; align-items: flex-end; justify-content: center; padding: 0; }
.sheet { background: var(--surface); width: min(560px, 100%); max-height: 92%; overflow: auto; border-radius: 18px 18px 0 0; padding: 18px var(--gutter-r) calc(18px + env(safe-area-inset-bottom, 0px)) var(--gutter-l); display: flex; flex-direction: column; gap: 14px; }
@media (min-width: 640px) { .scrim { align-items: center; padding: 24px; } .sheet { border-radius: 18px; padding: 20px; } }
.sheet h2 { font-size: 20px; }
#toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(84px + env(safe-area-inset-bottom, 0px)); z-index: 50; background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 999px; font-size: 14px; max-width: calc(100% - 32px); opacity: 0; pointer-events: none; transition: opacity .2s; }
#toast.on { opacity: 1; }
.priv li { margin-bottom: 6px; }
.priv ul { margin: 0; padding-left: 20px; }
@media (max-width: 420px) { .rv-ctrls, .form-grid { grid-template-columns: minmax(0, 1fr); } .month select { min-width: 0; width: 100%; } .month { width: 100%; } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
/* Cuentas Claras · núcleo: lectura de resúmenes (parsers) + lógica de cuotas.
   Funciones puras, sin DOM. Se prueban con Node y se incrustan en la página. */
(function (root) {
  'use strict';

  /* ---------- utilidades ---------- */
  var MESES = {
    ene: 0, feb: 1, mar: 2, abr: 3, may: 4, jun: 5, jul: 6, ago: 7, sep: 8, set: 8, oct: 9, nov: 10, dic: 11,
    enero: 0, febrero: 1, marzo: 2, abril: 3, mayo: 4, junio: 5, julio: 6, agosto: 7,
    septiembre: 8, setiembre: 8, octubre: 9, noviembre: 10, diciembre: 11
  };
  var AMT = '-?\\d{1,3}(?:\\.\\d{3})*,\\d{2}';
  var AMTP = '\\d{1,3}(?:\\.\\d{3})*,\\d{2}';
  var LABELS = { 'galicia-visa': 'Galicia Visa', 'galicia-mc': 'Galicia Mastercard', mp: 'Mercado Pago', manual: 'Cargado manualmente' };

  function strip(s) { return String(s).normalize('NFD').replace(/[̀-ͯ]/g, ''); }
  function mesIdx(s) { var v = MESES[strip(s).toLowerCase()]; return v === undefined ? -1 : v; }
  function num(s) { return parseFloat(String(s).replace(/\./g, '').replace(',', '.')); }
  function r2(x) { return Math.round(x * 100) / 100; }
  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function iso(y, m, d) { return y + '-' + pad(m + 1) + '-' + pad(d); }
  function normDesc(s) { return strip(s).toLowerCase().replace(/\s+/g, ' ').trim(); }
  function normCore(s) { return normDesc(s).replace(/^reembolso de /, ''); }
  function nameBase(s) {
    return strip(s).toLowerCase().replace(/^(reembolso de|transferencia para)\s+/, '')
      .replace(/\.com(\.ar)?/g, '').replace(/usd/g, '').replace(/[^a-z]/g, '');
  }
  function uid() { return Math.random().toString(36).slice(2, 8) + Date.now().toString(36).slice(-4); }
  function clone(o) { return JSON.parse(JSON.stringify(o)); }

  function cleanLines(input) {
    var arr = Array.isArray(input) ? input : String(input).split(/\r?\n/);
    var out = [];
    arr.forEach(function (l) {
      var t = String(l).replace(/[   ]/g, ' ').replace(/\s+/g, ' ').trim();
      if (t) out.push(t);
    });
    return out;
  }

  function detectIssuer(lines) {
    var text = lines.join('\n');
    if (/Este es tu resumen de/i.test(text) && /mercado\s*pago|mercadolibre/i.test(text)) return 'mp';
    if (/Tarjeta\s+Cr.dito\s+MASTERCARD/i.test(text)) return 'galicia-mc';
    if (/Tarjeta\s+Cr.dito\s+VISA/i.test(text)) return 'galicia-visa';
    return null;
  }

  function baseResult(issuer) {
    return {
      issuer: issuer, label: LABELS[issuer], closeISO: null, dueISO: null, payMonth: null,
      lines: [], refunds: [], expected: null, sum: { ars: 0, usd: 0 }, ok: false, problems: []
    };
  }

  function finish(res) {
    res.sum.ars = 0; res.sum.usd = 0;
    res.lines.forEach(function (l) { if (l.currency === 'USD') res.sum.usd += l.amount; else res.sum.ars += l.amount; });
    res.sum.ars = r2(res.sum.ars); res.sum.usd = r2(res.sum.usd);
    if (!res.closeISO) res.problems.push('No encontré las fechas de cierre y vencimiento.');
    if (!res.lines.length) res.problems.push('No encontré ningún consumo.');
    if (!res.expected) res.problems.push('No encontré el total de consumos del resumen para chequear.');
    else {
      if (Math.abs(res.sum.ars - res.expected.ars) > 0.009)
        res.problems.push('La suma de lo que leí en pesos da ' + res.sum.ars.toFixed(2) + ' y el resumen dice ' + res.expected.ars.toFixed(2) + '.');
      if (Math.abs(res.sum.usd - (res.expected.usd || 0)) > 0.009)
        res.problems.push('La suma de lo que leí en dólares da ' + res.sum.usd.toFixed(2) + ' y el resumen dice ' + (res.expected.usd || 0).toFixed(2) + '.');

  }

  /* ---------- Galicia (Visa y Mastercard) ---------- */
  function galiciaDates(lines) {
    var re = /\b(\d{2})-([A-Za-zÀ-ÿ]{3})-(\d{2})\b/g;
    for (var i = 0; i < lines.length; i++) {
      var m = Array.from(lines[i].matchAll(re));
      if (m.length >= 6) {
        var f = function (x) { return iso(2000 + (+x[3]), mesIdx(x[2]), +x[1]); };
        return { closeISO: f(m[2]), dueISO: f(m[3]) };
      }
    }
    return null;
  }

  function parseGalicia(lines, issuer) {
    var res = baseResult(issuer);
    var d = galiciaDates(lines);
    if (d) { res.closeISO = d.closeISO; res.dueISO = d.dueISO; res.payMonth = d.dueISO.slice(0, 7); }
    var isVisa = issuer === 'galicia-visa';
    var reV = new RegExp('^(\\d{2})-(\\d{2})-(\\d{2})\\s+(?:[*K]\\s+)?(.+?)\\s+(?:(\\d{2})/(\\d{2})\\s+)?(\\d{4,8})\\s+(' + AMT + ')$');
    var reM = new RegExp('^(\\d{2})-([A-Za-z\\u00C0-\\u00FF]{3})-(\\d{2})\\s+(.+?)\\s+(?:(\\d{1,2})/(\\d{1,2})\\s+)?(\\d{4,8})\\s+(' + AMT + ')$');
    var reTotV = new RegExp('Total Consumos de .*?(' + AMT + ')(?:\\s+(' + AMT + '))?\\s*$');
    var reTotM = new RegExp('^SUBTOTAL\\s+(' + AMT + ')(?:\\s+(' + AMT + '))?\\s*$');
    var inDetail = false;
    for (var i = 0; i < lines.length; i++) {
      var l = lines[i];
      if (/^DETALLE DEL CONSUMO/i.test(l)) { inDetail = true; continue; }
      if (!inDetail) continue;
      var t = l.match(isVisa ? reTotV : reTotM);
      if (t) { res.expected = { ars: num(t[1]), usd: t[2] != null ? num(t[2]) : 0 }; break; }
      var m = l.match(isVisa ? reV : reM);
      if (!m) continue;
      var date = isVisa ? iso(2000 + (+m[3]), (+m[2]) - 1, +m[1]) : iso(2000 + (+m[3]), mesIdx(m[2]), +m[1]);
      var descRaw = m[4];
      var usd = /USD/i.test(descRaw);
      var desc = descRaw.replace(/\s*\d*USD\s+[\d.,]+\s*$/i, '').trim() || descRaw;
      res.lines.push({
        date: date, desc: desc, descRaw: descRaw,
        cuota: m[5] ? +m[5] : null, total: m[6] ? +m[6] : null,
        amount: num(m[8]), currency: usd ? 'USD' : 'ARS', ref: m[7]
      });
    }
    return finish(res);
  }

  /* ---------- Mercado Pago ---------- */
  function mpYear(day, mIdx, cuotaN, close) {
    var closeIdx = close.y * 12 + close.m;
    if (cuotaN) {
      for (var y = close.y; y >= close.y - 5; y--) {
        var first = y * 12 + mIdx + (day > close.d ? 1 : 0);
        if (first + (cuotaN - 1) === closeIdx) return y;
      }
    }
    var yy = close.y;
    if (mIdx > close.m || (mIdx === close.m && day > close.d)) yy--;
    return yy;
  }

  function parseMP(lines, opts) {
    opts = opts || {};
    var res = baseResult('mp');
    var cyc = null;
    for (var i = 0; i < lines.length && !cyc; i++) {
      var c = lines[i].match(/Cierre actual\s+(\d{1,2}) de ([A-Za-zÀ-ÿ]+)\s+Vencimiento actual\s+(\d{1,2}) de ([A-Za-zÀ-ÿ]+)/i);
      if (c) cyc = c;
    }
    var close = null;
    if (cyc) {
      var cm = mesIdx(cyc[2]), cd = +cyc[1], dm = mesIdx(cyc[4]), dd = +cyc[3];
      var today = opts.today || new Date();
      var cy = opts.year;
      if (!cy) { cy = today.getFullYear(); if (new Date(cy, cm, cd) > today) cy--; }
      var dy = dm < cm ? cy + 1 : cy;
      close = { y: cy, m: cm, d: cd };
      res.closeISO = iso(cy, cm, cd); res.dueISO = iso(dy, dm, dd); res.payMonth = res.dueISO.slice(0, 7);
      res.year = cy;

    var sec = 'consumos';
    lines.forEach(function (l) {
      var e = l.match(reE);
      if (e) { res.expected = { ars: num(e[1]), usd: num(e[2]) }; return; }
      if (/^Ajustes y reembolsos$/i.test(l)) { sec = 'ajustes'; return; }
      if (/^Impuestos e intereses/i.test(l)) { sec = 'impuestos'; return; }
      if (/^Pagos anticipados$/i.test(l)) { sec = 'pagos'; return; }
      if (/^Consumos$/i.test(l)) { sec = 'consumos'; return; }
      if (sec === 'impuestos' || sec === 'pagos') return;
      var m = l.match(reL);
      if (!m || !close) return;
      var mi = mesIdx(m[2]); if (mi < 0) return;
      var cuota = m[4] ? +m[4] : null;
      var y = mpYear(+m[1], mi, cuota, close);
      var amount = num(m[9]) * (m[7] ? -1 : 1);
      var line = {
        date: iso(y, mi, +m[1]), desc: m[3].trim(), descRaw: m[3].trim(),
        cuota: cuota, total: m[5] ? +m[5] : null, amount: amount,
        currency: m[8] ? 'USD' : 'ARS', ref: m[6]

      if (sec === 'ajustes') res.refunds.push(line); else res.lines.push(line);
    });
    return finish(res);
  }

  function parseStatement(input, opts) {
    var lines = cleanLines(input);

      r.problems.push('No reconozco este resumen. Por ahora leo Galicia Visa, Galicia Mastercard y Mercado Pago.');

    return issuer === 'mp' ? parseMP(lines, opts) : parseGalicia(lines, issuer);

  /* ---------- anulaciones (compra y devolución) ---------- */

        var b = all[j];
        if (j === i || used[j] || b.amount <= 0 || b.currency !== a.currency) continue;
        if (r2(a.amount + b.amount) === 0 && normCore(a.desc) === normCore(b.desc)) {

  /* ---------- estado y conciliación ---------- */

        });

    if (prev) {
      missing = st.expenses.filter(function (e) {
        return e.issuer === parsed.issuer && e.kind === 'cuota' && e.status === 'activo' && !used[e.id] &&
          lastEntry(e).stmtId === prev.id && lastEntry(e).cuota < e.key.total;
      }).map(function (e) { return { id: e.id, desc: e.custom || e.desc, cuota: lastEntry(e).cuota, total: e.key.total }; });
    }

  }

  // mapa contacto -> usuario: coinciden por mail
  function userOfContact(state, contactId) {
    var c = (state.contacts || []).find(function (x) { return x.id === contactId; });
    if (!c || !c.email) return null;
    var m = c.email.trim().toLowerCase();
    return USERS.find(function (u) { return u.email === m; }) || null;
  }

  function myContacts(state) { return (state.contacts || []).filter(function (x) { return (x.owner || 'u-fercho') === state.whoami; }); }
  function activeContacts(state) { return myContacts(state).filter(function (x) { return !x.removed; }); }
  // si el mail del contacto es de un usuario de la app, le manda la solicitud (si hace falta)
  function requestFor(state, contact) {
    var owner = contact.owner || 'u-fercho', mail = (contact.email || '').trim().toLowerCase();
    var u = USERS.find(function (x) { return x.email === mail; });
    if (!u || u.id === owner || contact.removed) return false;
    var me = USERS.find(function (x) { return x.id === owner; });
    var mutual = (state.contacts || []).some(function (x) { return (x.owner || 'u-fercho') === u.id && !x.removed && me && (x.email || '').trim().toLowerCase() === me.email; });
    if (mutual) return false;
    state.friendReqs = state.friendReqs || [];
    if (state.friendReqs.some(function (r) { return r.status === 'pending' && r.from === owner && r.to === u.id; })) return false;
    state.friendReqs.push({ id: uid(), from: owner, to: u.id, status: 'pending', ts: Date.now() });
    return true;
  }
  // arregla estados viejos: contactos que son usuarios y nunca tuvieron solicitud
  function migrateRequests(state) {
    (state.contacts || []).forEach(function (ct) {
      var owner = ct.owner || 'u-fercho', mail = (ct.email || '').trim().toLowerCase();
      var u = USERS.find(function (x) { return x.email === mail; });
      if (!u || u.id === owner || ct.removed) return;
      var any = (state.friendReqs || []).some(function (r) { return (r.from === owner && r.to === u.id) || (r.from === u.id && r.to === owner); });
      if (!any) requestFor(state, ct);

  }
  // estado de mi última solicitud hacia el usuario de este contacto: 'pending' | 'rejected' | null
  function reqStatus(state, contact) {

    var u = USERS.find(function (x) { return x.email === mail; }); if (!u) return null;
    var mine = (state.friendReqs || []).filter(function (r) { return r.from === owner && r.to === u.id; }).sort(function (x, y) { return (y.ts || 0) - (x.ts || 0); })[0];
    if (!mine) return null;
    return mine.status === 'pending' || mine.status === 'rejected' ? mine.status : null; // la más reciente manda
  }
  // relación de un contacto mío con la otra cuenta: 'plain' (no usa la app) | 'mutual' | 'pending' | 'rejected' | 'cut' (me sacó de sus contactos)
  function contactLink(state, contact) {
    var owner = contact.owner || 'u-fercho', mail = (contact.email || '').trim().toLowerCase();
    var u = USERS.find(function (x) { return x.email === mail; }); if (!u || u.id === owner) return 'plain';
    var me = USERS.find(function (x) { return x.id === owner; });
    var mutual = (state.contacts || []).some(function (x) { return (x.owner || 'u-fercho') === u.id && !x.removed && me && (x.email || '').trim().toLowerCase() === me.email; });

    var st = reqStatus(state, contact);

  }
  function incomingReqs(state) { return (state.friendReqs || []).filter(function (r) { return r.status === 'pending' && r.to === state.whoami; }); }
  // gente que está en alguno de mis grupos y no tengo como contacto (ni invitada)
  function groupStrangers(state) {
    var have = {}; activeContacts(state).forEach(function (x) { if (x.email) have[x.email.trim().toLowerCase()] = 1; });
    (state.friendReqs || []).forEach(function (r) { if (r.status !== 'pending') return; var o = r.from === state.whoami ? r.to : (r.to === state.whoami ? r.from : null), u = o && USERS.find(function (x) { return x.id === o; }); if (u) have[u.email] = 1; });
    var out = {};
    (state.groups || []).forEach(function (g) {
      if (g.members.indexOf(state.whoami) < 0) return;
      g.members.forEach(function (id) {
        if (id === state.whoami || out[id]) return;
        var u = USERS.find(function (x) { return x.id === id; });
        if (u && !have[u.email]) out[id] = { user: u, groups: [] };
      });
    });
    (state.groups || []).forEach(function (g) { Object.keys(out).forEach(function (id) { if (g.members.indexOf(state.whoami) >= 0 && g.members.indexOf(id) >= 0) out[id].groups.push(g.name); }); });

  }

  }

    var desc = e.custom || e.desc;

    g.activity = g.activity || [];
    g.activity.push({ id: uid(), ts: Date.now() + (i || 0), who: s.whoami, text: 'cargó "' + desc + '" por ' + fmtARS(entry.amount) + ' desde un resumen de tarjeta, entre ' + userName(s.whoami) + ' y ' + u.name });
  }
  function commitImport(state, parsed, plan, choices) {
    var s = clone(state);

      payMonth: parsed.payMonth, importedAt: Date.now(), total: parsed.expected ? parsed.expected.ars : 0,

  /* ---------- vistas por mes ---------- */
  var MESES_LARGO = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'];
  function monthLabel(ym) { var p = ym.split('-'); return MESES_LARGO[+p[1] - 1] + ' ' + p[0]; }
  function monthDiff(a, b) { var x = a.split('-'), y = b.split('-'); return (+y[0] * 12 + +y[1]) - (+x[0] * 12 + +x[1]); }

    if (m.monthly) return { cuota: null, total: null };
    return d === 0 ? { cuota: null, total: null } : null;
  }

  function addMonths(ym, n) {
    var p = ym.split('-'), t = (+p[0]) * 12 + (+p[1] - 1) + n;
    return Math.floor(t / 12) + '-' + pad(t % 12 + 1);
  }

  /* Cuotas de meses sin resumen cargado: se estiman desde el último resumen conocido
     (cuota = última conocida + meses transcurridos). */
  function projectedRows(state, ym) {
    var rows = [];
    var have = {};
    state.statements.forEach(function (s) { have[s.issuer + '|' + s.payMonth] = true; });
    state.expenses.forEach(function (e) {
      if (e.kind !== 'cuota' || e.status !== 'activo') return;
      if (have[e.issuer + '|' + ym]) return;
      var last = lastEntry(e), s = stmtOf(state, last.stmtId);
      if (!s || !s.payMonth || s.payMonth >= ym) return;
      var base = { month: s.payMonth, cuota: last.cuota, total: e.key.total, amount: last.amount };
      Object.keys(e.anchors || {}).sort().forEach(function (k) { if (k <= ym && k > base.month) base = { month: k, cuota: e.anchors[k].cuota, total: e.anchors[k].total, amount: e.anchors[k].amount }; });
      var n = base.cuota + monthDiff(base.month, ym);
      if (n > base.total) return;
      rows.push({
        source: 'pdf', estimated: true, ym: ym, expenseId: e.id, entryIdx: null, stmtId: s.id, issuer: e.issuer, label: LABELS[e.issuer] || e.issuer,
        desc: e.custom || e.desc, custom: e.custom, descRaw: e.desc, kind: 'cuota', tag: e.tag, cuota: n, total: base.total,
        amount: base.amount, currency: last.currency, splitWith: e.splitWith, status: e.status, date: last.date, ref: last.ref
      });
    });
    return rows;
  }

  function monthsAvailable(state) {
    var set = {};
    state.statements.forEach(function (s) { if (s.payMonth) set[s.payMonth] = 1; });
    state.manual.forEach(function (m) { set[m.startMonth] = 1; });
    state.expenses.forEach(function (e) {
      if (e.kind !== 'cuota' || e.status !== 'activo') return;
      var last = lastEntry(e), s = stmtOf(state, last.stmtId);
      if (!s || !s.payMonth) return;
      var rest = Math.min(e.key.total - last.cuota, 12);
      for (var i = 1; i <= rest; i++) set[addMonths(s.payMonth, i)] = 1;
    });
    set[nowYM()] = 1;
    return Object.keys(set).sort().reverse();
  }

  function entriesForMonth(state, ym) {
    var rows = [];
    var stmts = state.statements.filter(function (s) { return s.payMonth === ym; });
    var ids = {}; stmts.forEach(function (s) { ids[s.id] = s; });
    state.expenses.forEach(function (e) {
      e.entries.forEach(function (en, idx) {
        var s = ids[en.stmtId]; if (!s) return;
        rows.push({
          source: 'pdf', ym: ym, expenseId: e.id, entryIdx: idx, stmtId: s.id, issuer: e.issuer, label: LABELS[e.issuer] || e.issuer,
          desc: e.custom || e.desc, custom: e.custom, descRaw: e.desc, kind: e.kind, tag: e.tag, cuota: en.cuota, total: en.total,
          amount: en.amount, currency: en.currency, splitWith: e.splitWith, groupId: e.groupId || null, status: e.status, date: en.date, ref: en.ref
        });
      });
    });
    state.manual.forEach(function (m) {
      var c = manualCuota(m, ym); if (!c) return;
      rows.push({
        source: 'manual', ym: ym, manualId: m.id, issuer: 'manual', label: LABELS.manual, desc: m.desc, custom: m.desc, descRaw: m.desc,
        kind: m.monthly ? 'recurrente' : (c.total ? 'cuota' : 'unico'), cuota: c.cuota, total: c.total, amount: m.amount,
        currency: m.currency || 'ARS', splitWith: m.splitWith, status: 'activo', monthly: !!m.monthly
      });
    });
    return rows.concat(projectedRows(state, ym));
  }

  function totals(rows) {
    var t = { total: { ARS: 0, USD: 0 }, mine: { ARS: 0, USD: 0 }, owed: { ARS: 0, USD: 0 }, by: {} };
    rows.forEach(function (r) {
      if (r.status === 'anulado') return;
      var cur = r.currency === 'USD' ? 'USD' : 'ARS';
      t.total[cur] += r.amount;
      if (r.splitWith && r.groupId) {
        t.mine[cur] += r.amount - r2(r.amount / 2); // la otra mitad se cobra en el grupo
      } else if (r.splitWith) {
        var other = r2(r.amount / 2);
        t.owed[cur] += other; t.mine[cur] += r.amount - other;
        var b = t.by[r.splitWith] = t.by[r.splitWith] || { ARS: 0, USD: 0, rows: [] };
        b[cur] += other; b.rows.push(Object.assign({ share: other }, r));
      } else t.mine[cur] += r.amount;
    });
    ['total', 'mine', 'owed'].forEach(function (k) { t[k].ARS = r2(t[k].ARS); t[k].USD = r2(t[k].USD); });
    Object.keys(t.by).forEach(function (k) { t.by[k].ARS = r2(t.by[k].ARS); t.by[k].USD = r2(t.by[k].USD); });
    return t;
  }

  /* ---------- grupos (partes iguales) ---------- */
  var USERS = [
    { id: 'u-fercho', name: 'Fercho', email: 'fercho@prueba.com' },
    { id: 'u-pepito', name: 'Pepito', email: 'pepito@prueba.com' },
    { id: 'u-juancito', name: 'Juancito', email: 'juancito@prueba.com' },
    { id: 'u-bren', name: 'Bren', email: 'bren@prueba.com' }
  ];
  function userName(id) { var u = USERS.find(function (x) { return x.id === id; }); return u ? u.name : 'Alguien'; }
  function cents(n) { return Math.round(n * 100); }
  function splitCents(total, ids) {
    var n = ids.length, base = Math.floor(total / n), rem = total - base * n;
    return ids.map(function (id, i) { return { id: id, cents: base + (i < rem ? 1 : 0) }; });
  }
  function groupBalances(g) {
    var b = {};
    g.members.forEach(function (m) { b[m] = { paid: 0, owed: 0, adj: 0 }; });
    g.expenses.forEach(function (e) {
      var c = cents(e.amount);
      if (b[e.paidBy]) b[e.paidBy].paid += c;
      splitCents(c, e.splitAmong).forEach(function (sh) { if (b[sh.id]) b[sh.id].owed += sh.cents; });
    });
    (g.payments || []).forEach(function (p) {
      if (p.status === 'pending') return;
      var c = cents(p.amount);
      if (b[p.from]) b[p.from].adj += c;
      if (b[p.to]) b[p.to].adj -= c;
    });
    var by = {}, nets = {};
    Object.keys(b).forEach(function (id) {
      var net = b[id].paid - b[id].owed + b[id].adj;
      nets[id] = net;
      by[id] = { paid: b[id].paid / 100, owed: b[id].owed / 100, net: net / 100 };
    });
    return { by: by, nets: nets };
  }
  // pocas transferencias: el que más debe le paga al que más tiene a favor
  function settle(nets) {
    var d = [], c = [], out = [];
    Object.keys(nets).forEach(function (id) {
      if (nets[id] < 0) d.push({ id: id, v: -nets[id] }); else if (nets[id] > 0) c.push({ id: id, v: nets[id] });
    });
    var byV = function (a, b) { return b.v - a.v; };
    while (d.length && c.length) {
      d.sort(byV); c.sort(byV);
      var x = Math.min(d[0].v, c[0].v);
      out.push({ from: d[0].id, to: c[0].id, amount: x / 100 });
      d[0].v -= x; c[0].v -= x;
      if (d[0].v === 0) d.shift();
      if (c[0].v === 0) c.shift();
    }
    return out;
  }

  /* ---------- quién me debe: una fila por persona ---------- */
  function personKey(state, contactId) {
    var u = userOfContact(state, contactId);
    return u ? u.id : 'c:' + contactId;
  }
  function personName(state, key) {
    if (key.indexOf('c:') === 0) { var c = (state.contacts || []).find(function (x) { return x.id === key.slice(2); }); return c ? c.alias : 'Sin contacto'; }
    return userName(key);
  }
  // total > 0: la persona te debe; total < 0: le debés vos (en pesos)
  function personDebts(state, me, month) {
    var people = {};
    function P(key) { return people[key] || (people[key] = { key: key, name: personName(state, key), total: 0, groups: [], personal: [], paid: [] }); }
    (state.groups || []).forEach(function (g) {
      if (g.members.indexOf(me) < 0) return;
      var nets = groupBalances(g).nets;
      settle(nets).forEach(function (t) {
        var other = t.from === me ? t.to : (t.to === me ? t.from : null);
        if (!other) return;
        var signed = t.to === me ? t.amount : -t.amount;
        var p = P(other); p.total += signed;
        // detalle: lo del tramo actual donde participa esa persona
        var cur = groupEpochs(g)[0], items = [];
        cur.items.forEach(function (it) {
          if (it.t === 'e') {
            var e = it.x, mine = 0;
            if (e.paidBy === me && e.splitAmong.indexOf(other) >= 0) mine = splitCents(cents(e.amount), e.splitAmong).find(function (x) { return x.id === other; }).cents / 100;
            else if (e.paidBy === other && e.splitAmong.indexOf(me) >= 0) mine = -splitCents(cents(e.amount), e.splitAmong).find(function (x) { return x.id === me; }).cents / 100;
            if (mine) items.push({ desc: e.desc, amount: mine, date: e.date });
          } else if (it.x.status !== 'pending') {
            var pa = it.x;
            if (pa.from === other && pa.to === me) items.push({ desc: 'Pago: te pagó', amount: -pa.amount, date: pa.date, pay: true });
            else if (pa.from === me && pa.to === other) items.push({ desc: 'Pago: le pagaste', amount: pa.amount, date: pa.date, pay: true });
          }
        });
        p.groups.push({ groupId: g.id, name: g.name, amount: signed, items: items });
      });
    });
    var rows = state.manual ? entriesForMonth(state, month) : [];
    rows.forEach(function (r) {
      if (!r.splitWith || r.groupId || r.status === 'anulado' || r.currency === 'USD' || !(r.amount > 0)) return;
      var p = P(personKey(state, r.splitWith)), share = r2(r.amount / 2);
      p.total += share;
      p.personal.push({ desc: r.desc, label: r.label, amount: share, cuota: r.cuota, totalCuotas: r.total });
    });
    (state.pay || []).forEach(function (x) { var p = P(x.key); p.total -= x.amount; p.paid.push(x); });
    var out = Object.keys(people).map(function (k) { people[k].total = r2(people[k].total); return people[k]; })
      .filter(function (p) { return p.total !== 0 || p.groups.length || p.personal.length; });
    out.sort(function (a, b) { return b.total - a.total; });
    return out;
  }

  // Historial por "épocas": cada vez que un pago confirmado deja a todos en cero, todo lo anterior se cierra.
  function groupEpochs(g) {
    var all = g.expenses.map(function (e) { return { t: 'e', x: e }; }).concat((g.payments || []).map(function (p) { return { t: 'p', x: p }; }))
      .sort(function (a, b) { return (a.x.ts || 0) - (b.x.ts || 0); });
    var epochs = [], cur = [], ex = [], pa = [];
    all.forEach(function (it) {
      cur.push(it);
      if (it.t === 'e') ex.push(it.x); else pa.push(it.x);
      if (it.t === 'p' && it.x.status !== 'pending' && ex.length) {
        var nets = groupBalances({ members: g.members, expenses: ex, payments: pa }).nets;
        if (Object.keys(nets).every(function (k) { return nets[k] === 0; })) {
          epochs.push({ items: cur, closer: it.x }); cur = []; ex = []; pa = [];
        }
      }
    });
    epochs.push({ items: cur, closer: null });
    var byDate = function (a, b) { return (b.x.date || '').localeCompare(a.x.date || '') || (b.x.ts || 0) - (a.x.ts || 0); };
    epochs.forEach(function (ep) {
      if (!ep.closer) { ep.closers = []; ep.items.sort(byDate); return; }
      // pagos de cierre: los pagos confirmados hechos después del último gasto del tramo
      var lastE = 0; ep.items.forEach(function (it) { if (it.t === 'e') lastE = Math.max(lastE, it.x.ts || 0); });
      ep.closers = ep.items.filter(function (it) { return it.t === 'p' && it.x.status !== 'pending' && (it.x.ts || 0) > lastE; }).map(function (it) { return it.x; });
      var ids = {}; ep.closers.forEach(function (p) { ids[p.id] = 1; });
      ep.items = ep.items.filter(function (it) { return !(it.t === 'p' && ids[it.x.id]); }).sort(byDate);
    });
    return epochs.reverse(); // la primera es la actual
  }
  function myShareCents(g, e, userId) {

  /* ---------- armado de líneas desde los textos que entrega pdf.js ---------- */
  function linesFromItems(items) {
    var its = items.filter(function (i) { return i.str && i.str.trim() !== ''; })
      .sort(function (a, b) { return b.y - a.y || a.x - b.x; });
    var groups = [], cur = null;

      '<div class="btns"><button class="btn" id="cSave">Guardar</button><button class="btn ghost" id="cCancel">Cancelar</button></div>',
      function (root) {

  /* ---------- armado de pantallas ---------- */

      if (months.indexOf(ui.month) < 0) months.unshift(ui.month);

  /* ----- Inicio ----- */
  function viewInicio() {

  function personListHTML() {

      });
      p.personal.forEach(function (x) {
        d += '<div class="row" style="cursor:default"><div class="row-main"><div class="row-title">' + esc(x.desc) + '</div><div class="chips">' + (x.totalCuotas ? '<span class="chip">Cuota ' + x.cuota + ' de ' + x.totalCuotas + '</span>' : '') + '<span class="chip">' + esc(x.label) + '</span>' + '<span class="chip">sin grupo</span></div></div><div class="row-amt">' + money(x.amount, 'ARS') + '</div></div>';

    }).join('') + '</section>';

  }
  function personPayModal(key) {

    openModal('<h2>Me pagó ' + esc(p ? p.name : '') + '</h2><p class="small muted">Anotás que te pasó plata por los gastos sin grupo. Baja lo que te debe. Con el backend, la otra persona lo va a poder confirmar.</p><label class="f wide">Monto (ARS)<input type="number" step="0.01" inputmode="decimal" id="ppAmt" value="' + esc(C.r2(Math.max(0, Math.min(p ? p.total : 0, pers)))) + '"></label><p class="err small" id="ppErr" hidden></p><div class="btns"><button class="btn" id="ppSave">Guardar</button><button class="btn ghost" id="ppCancel">Cancelar</button></div>', function (root) {

      };

  /* ----- Contactos ----- */

  function contactAlias(c) { var u = C.userOfContact(S, c.id); return (u && C.transferAlias(S, u.id)) || ''; }
  function viewContactos() {
    var act = C.activeContacts(S).filter(function (x) { return C.contactLink(S, x) !== 'cut'; }), cut = C.activeContacts(S).filter(function (x) { return C.contactLink(S, x) === 'cut'; }), gone = C.myContacts(S).filter(function (x) { return x.removed; }), str = C.groupStrangers(S), reqs = C.incomingReqs(S);
    var h = '';

        str.map(function (x) { return '<div class="row" style="cursor:default;align-items:center"><div class="row-main" style="gap:2px"><div class="row-title">' + esc(x.user.name) + '</div><div class="meta">' + esc(x.groups.join(', ')) + '</div></div><button class="btn small" data-act="inv-contact" data-id="' + esc(x.user.id) + '">Invitar a mis contactos</button></div>'; }).join('') + '</div></section>';

    });
    h += '</section>';
    if (gone.length || cut.length) {
      h += '<section class="card flat"><div class="sec-h" style="padding:16px 16px 4px"><h2>Ya no son contactos</h2></div><p class="muted small" style="padding:0 16px 8px">Sus deudas siguen a la vista en "Quién me debe". Solo se cortó la conexión en vivo.</p><div class="list">' +
        cut.map(function (c) { var n = nOf(c), al = contactAlias(c); return '<div class="row" style="cursor:default;align-items:center;flex-wrap:wrap"><div class="row-main" style="gap:2px"><div class="row-title">' + esc(c.alias) + ' <span class="chip">Te sacó de sus contactos</span></div><div class="meta">' + esc(c.email) + ' · ' + n + (n === 1 ? ' gasto dividido' : ' gastos divididos') + '</div></div><div class="btns" style="width:100%"><button class="btn small" data-act="reinvite" data-id="' + esc(c.id) + '">Volver a invitar</button><button class="btn danger small" data-act="del-contact" data-id="' + esc(c.id) + '">Quitar</button></div></div>'; }).join('') +
        gone.map(function (c) { var n = nOf(c), al = contactAlias(c); return '<div class="row" style="cursor:default;align-items:center;flex-wrap:wrap"><div class="row-main" style="gap:2px"><div class="row-title">' + esc(c.alias) + ' <span class="chip">Ya no es contacto</span></div><div class="meta">' + esc(c.email) + ' · ' + n + (n === 1 ? ' gasto dividido' : ' gastos divididos') + '</div>' + (al ? '<div class="meta">Alias para transferir: <b style="color:var(--fg)">' + esc(al) + '</b></div>' : '') + '</div><div class="btns" style="width:100%">' + copyBtn(al) + '<button class="btn ghost small" data-act="readd-contact" data-id="' + esc(c.id) + '">Volver a agregar</button></div></div>'; }).join('') + '</div></section>';

  /* ----- Pruebas (entorno de homologación) ----- */

  /* ----- Grupos ----- */
  function gOf(id) { return S.groups.find(function (g) { return g.id === id; }); }
  function mine() { return S.groups.filter(function (g) { return g.members.indexOf(S.whoami) >= 0; }); }
  function whoSelect() {
    return '<label class="f" style="max-width:260px">Quién soy (modo prueba)<select id="whoami">' + C.USERS.map(function (u) { return '<option value="' + u.id + '"' + (u.id === S.whoami ? ' selected' : '') + '>' + esc(u.name) + '</option>'; }).join('') + '</select></label>';
  }
  function netLine(net) {
    if (net > 0) return '<small>Te deben</small><b>' + money(net, 'ARS') + '</b>';
    if (net < 0) return '<small>Tenés que pagar</small><b>' + money(-net, 'ARS') + '</b>';
    return '<small>Estás al día</small><b>' + money(0, 'ARS') + '</b>';
  }
  function groupRowHTML(x) {

  }
  function groupsHome() {
    var list = mine();

    h += '<div class="sec-h" style="padding:12px 16px 14px;border-top:1px solid var(--line)"><span>Saldo entre todos tus grupos</span><b class="num' + (net < 0 ? ' owe-t' : '') + '">' + (net === 0 ? 'Al día' : (net > 0 ? 'Te deben ' : 'Debés ') + money(Math.abs(net), 'ARS')) + '</b></div>';

  function viewGrupos() {

    else h += '<div class="list">' + sug.map(function (s, i) {
      return '<div class="row" style="cursor:default;align-items:center"><div class="row-main"><div class="row-title">' + esc(C.userName(s.from)) + ' → ' + esc(C.userName(s.to)) + '</div>' + (C.transferAlias(S, s.to) ? '<div class="meta">Alias de ' + esc(C.userName(s.to)) + ': <b style="color:var(--fg)">' + esc(C.transferAlias(S, s.to)) + '</b></div>' : '') + '</div><div class="row-amt">' + money(s.amount, 'ARS') + '</div>' + (s.from === S.whoami && C.transferAlias(S, s.to) ? '<button class="btn small ghost" data-act="copy-alias" data-v="' + esc(C.transferAlias(S, s.to)) + '">Copiar alias</button>' : '') + (s.from === S.whoami || s.to === S.whoami ? '<button class="btn small ghost" data-act="g-settle" data-i="' + i + '">' + (s.from === S.whoami ? 'Ya pagué' : 'Me pagó') + '</button>' : '') + '</div>';
    }).join('') + '</div>';
    h += '</section>';
    var order = [S.whoami].concat(g.members.filter(function (m) { return m !== S.whoami; }));
    h += '<section class="card flat"><div class="sec-h" style="padding:16px 16px 12px"><h2>Cada uno</h2><span>saldo</span></div><div class="list">' + order.map(function (m) {
      var x = b.by[m], lab = x.net > 0 ? '<span class="gain">puso de más ' + money(x.net, 'ARS') + '</span>' : (x.net < 0 ? '<span class="owe">le falta poner ' + money(-x.net, 'ARS') + '</span>' : '<span class="muted">está al día</span>');
      return '<div class="row" style="cursor:default;align-items:center"><div class="row-main"><div class="row-title">' + esc(C.userName(m)) + (m === S.whoami ? ' (yo)' : '') + '</div></div><div class="row-amt" style="font-size:15px;text-align:right">' + lab + '</div></div>';
    }).join('') + (g.pending && g.pending.length ? g.pending.map(function (e) { return '<div class="row" style="cursor:default"><div class="row-main"><div class="row-title">' + esc(e) + '</div><div class="meta">Invitado · todavía no se registró</div></div></div>'; }).join('') : '') + '</div></section>';
    var eps = C.groupEpochs(g), total = g.expenses.length + (g.payments || []).length;
    var check = '<svg class="ck" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12.500 4.500 4.500L19 7.500"/></svg>';
    function payRow(p) {

      return '<div class="row pend" style="cursor:default;flex-wrap:wrap"><div class="row-main"><div class="row-title">' + title + '</div><div class="meta">Pago pendiente · ' + fdate(p.date) + ' · lo registró ' + esc(C.userName(p.by)) + '</div><div class="chips"><span class="chip chip-warn">Falta que ' + esc(C.userName(other)) + ' lo confirme</span></div></div><div class="row-amt">' + money(p.amount, 'ARS') + '</div>' +
        '<div class="btns" style="width:100%;margin-top:6px">' + (iConfirm ? '<button class="btn small" data-act="g-pconfirm" data-id="' + esc(p.id) + '">Confirmar</button><button class="btn ghost small" data-act="g-preject" data-id="' + esc(p.id) + '">Rechazar</button>' : '') + (mineP ? '<button class="btn ghost small" data-act="g-pcancel" data-id="' + esc(p.id) + '">Cancelar pago</button>' : '') + '</div></div>';
    }
    function itemRow(it) {

    // franja "Todo saldado": solo se ve la más reciente; las anteriores quedan una adentro de la otra
    function bandHTML(k) {

  function readManual(d) {

  function reviewHTML(rv, ri) {
    if (rv.status === 'saved') return '<section class="card"><div class="alert good"><b>' + esc(rv.parsed.label) + ' guardado.</b><span>' + esc(rv.name) + ' · ' + rv.savedCount + ' movimientos cargados.</span></div><div class="btns"><button class="btn ghost small" data-act="rv-discard" data-ri="' + ri + '">Cerrar</button></div></section>';
    if (rv.error) return '<section class="card"><h3>' + esc(rv.name) + '</h3><div class="alert bad">' + esc(rv.error) + '</div><div class="btns"><button class="btn ghost small" data-act="rv-discard" data-ri="' + ri + '">Cerrar</button></div></section>';
    var p = rv.parsed;
    if (!p.issuer) return '<section class="card"><h3>' + esc(rv.name) + '</h3><div class="alert bad">' + esc(p.problems.join(' ')) + '</div><div class="btns"><button class="btn ghost small" data-act="rv-discard" data-ri="' + ri + '">Cerrar</button></div></section>';
    var plan = p.closeISO ? C.planImport(S, p) : { items: [], netted: [], missing: [] };
    rv.plan = plan;
    var dup = p.closeISO && S.statements.some(function (s) { return s.issuer === p.issuer && s.closeISO === p.closeISO; });
    var newer = p.closeISO && S.statements.some(function (s) { return s.issuer === p.issuer && s.closeISO > p.closeISO; });
    var block = !p.ok || dup || newer;

    }

      else if (ch.acceptSuggest === false) h += '<div class="alert">Va como gasto nuevo.</div><div class="btns"><button class="btn ghost small" data-act="rv-ask" data-ri="' + ri + '" data-ii="' + i + '" data-v="si">Sí, es el mismo</button></div>';
      else h += '<div class="btns"><button class="btn small" data-act="rv-ask" data-ri="' + ri + '" data-ii="' + i + '" data-v="si">Sí, es el mismo</button><button class="btn ghost small" data-act="rv-ask" data-ri="' + ri + '" data-ii="' + i + '" data-v="no">No, es nuevo</button></div>';
      h += '</div>';
    });
    if (plan.netted.length) h += '<div class="alert"><b>Se anulan entre sí</b><span>' + plan.netted.map(function (n) { return esc(n.desc) + ' (' + money(n.amount, n.currency) + ' cobrado y devuelto)'; }).join(', ') + '. No cuentan como deuda.</span></div>';
    if (plan.missing.length) h += '<div class="alert warn"><b>Estas cuotas no aparecieron este mes</b><span>' + plan.missing.map(function (m) { return esc(m.desc) + ' (iba por la ' + m.cuota + ' de ' + m.total + ')'; }).join(', ') + '. Puede ser una cancelación anticipada.</span></div>';

    var nCuotas = plan.items.filter(function (i) { return i.match && i.line.total; }).length;
    var nRec = plan.items.filter(function (i) { return i.match && !i.line.total; }).length;
    h += '<div class="chips"><span class="chip">' + plan.items.length + ' movimientos</span>' + (nCuotas ? '<span class="chip chip-good">' + nCuotas + ' cuotas que avanzan</span>' : '') + (nRec ? '<span class="chip chip-good">' + nRec + ' de todos los meses</span>' : '') + '</div>';

    h += '<div class="card flat" style="border-radius:12px">' + plan.items.map(function (it, i) {
      var ch = rv.choices[i] || (rv.choices[i] = {});
      var ef = effective(it, ch);

      var amt = '<div class="row-amt' + (l.amount < 0 ? ' neg' : '') + '">' + money(l.amount, l.currency) + '</div>';
      if (it.annul) return '<div class="rv-item"><div class="rv-top"><div class="row-main"><div class="row-title">' + esc(l.desc) + '</div><div class="chips">' + itemBadge(it, ef.e) + '</div></div>' + amt + '</div></div>';
      return '<div class="rv-item"><div class="rv-top"><div class="row-main"><div class="row-title mono" style="font-size:13px">' + esc(l.desc) + '</div><div class="chips">' + itemBadge(it, ef.e) + '<span class="chip">' + fshort(l.date) + '</span></div></div>' + amt + '</div>' +
        '<div class="rv-ctrls"><input type="text" class="rv-custom" data-ri="' + ri + '" data-ii="' + i + '" value="' + esc(ef.custom) + '" placeholder="Qué es (ej. cubrecama)" aria-label="Descripción propia"><select class="rv-split" data-ri="' + ri + '" data-ii="' + i + '" aria-label="Dividir con">' + contactOptions(ef.split, true) + '</select></div>' + rvGroupHTML(ef, ri, i) + '</div>';
    }).join('') + '</div>';
    h += '<div class="btns"><button class="btn" data-act="rv-save" data-ri="' + ri + '"' + (block ? ' disabled' : '') + '>Guardar resumen</button><button class="btn ghost" data-act="rv-discard" data-ri="' + ri + '">Descartar</button></div></section>';
    return h;
  }

  /* ---------- lectura de PDF ---------- */
  function pdfToLines(file) {
    if (!window.pdfjsLib) return Promise.reject(new Error('No pude cargar el lector de PDF. Revisá tu conexión y probá de nuevo.'));
    try { window.pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js'; } catch (e) { /* ignorar */ }
    return file.arrayBuffer().then(function (buf) {
      return window.pdfjsLib.getDocument({ data: new Uint8Array(buf) }).promise;
    }).then(function (pdf) {
      var chain = Promise.resolve(), lines = [];
      for (var p = 1; p <= pdf.numPages; p++) {
        (function (n) {
          chain = chain.then(function () { return pdf.getPage(n); }).then(function (page) { return page.getTextContent(); }).then(function (tc) {
            var items = tc.items.map(function (i) { return { str: i.str, x: i.transform[4], y: i.transform[5], w: i.width }; });
            C.linesFromItems(items).forEach(function (l) { lines.push(l); });
          });
        })(p);
      }
      return chain.then(function () { return lines; });
    });
  }

  function handleFiles(files) {
    var list = Array.prototype.slice.call(files).filter(function (f) { return /pdf$/i.test(f.type) || /\.pdf$/i.test(f.name); });
    if (!list.length) { toast('Elegí un archivo PDF.'); return; }
    if (S.demo) { S = C.emptyState(); save(); }
    ui.busy++; render();
    Promise.all(list.map(function (f) {
      return pdfToLines(f).then(function (lines) {
        return { name: f.name, lines: lines, parsed: C.parseStatement(lines), choices: [], status: 'review' };
      }).catch(function (err) {
        var m = String(err && err.message || err);
        if (/password/i.test(m)) m = 'Este PDF tiene contraseña. Sacásela y probá de nuevo.';
        else if (!/lector de PDF/.test(m)) m = 'No pude abrir este PDF. ' + m;
        return { name: f.name, error: m, choices: [], status: 'error' };
      });
    })).then(function (rvs) {
      rvs.sort(function (a, b) { return String(a.parsed && a.parsed.closeISO).localeCompare(String(b.parsed && b.parsed.closeISO)); });
      ui.reviews = ui.reviews.concat(rvs); ui.busy--; render();
    });
  }

  function reparse(ri, year) {
    var rv = ui.reviews[ri]; rv.parsed = C.parseStatement(rv.lines, { year: year }); rv.choices = []; render();
  }

  function saveReview(ri) {
    var rv = ui.reviews[ri], p = rv.parsed;
    if (!p.ok) return;
    var plan = C.planImport(S, p);
    S = C.commitImport(S, p, plan, rv.choices);
    save();
    rv.status = 'saved'; rv.savedCount = plan.items.length + plan.netted.length * 2;
    ui.month = p.payMonth;
    toast('Resumen guardado');
    render();
  }

  /* ---------- editar un gasto ---------- */

      d = d || { custom: e.custom || '', splitWith: e.splitWith || '' };
      body = '<p class="meta">Para corregir la cuota o el monto, tocá "Cuota ' + r.cuota + ' de ' + r.total + '" o el importe en la lista.</p><p class="meta mono">' + esc(e.desc) + '</p>' +
        '<div class="form-grid"><label class="f wide">Descripción propia<input type="text" id="eCustom" value="' + esc(d.custom) + '" placeholder="Qué es (ej. cubrecama)"></label>' +
        '<label class="f wide">Dividir con (mitad y mitad)<select id="eSplit">' + contactOptions(d.splitWith, true) + '</select></label></div>';
    } else if (isPdf) {
      d = d || { custom: e.custom || '', splitWith: e.splitWith || '', amount: r.amount, cuota: r.cuota || '', total: r.total || '' };

        '<div class="form-grid"><label class="f wide">Descripción propia<input type="text" id="eCustom" value="' + esc(d.custom) + '" placeholder="Qué es (ej. cubrecama)"></label>' +
        '<label class="f wide">Dividir con (mitad y mitad)<select id="eSplit">' + contactOptions(d.splitWith, true) + '</select></label>' +
        '<label class="f">Monto de esta cuota<input type="number" step="0.01" inputmode="decimal" id="eAmount" value="' + esc(d.amount) + '"></label>' +
        (e.kind === 'cuota' ? '<label class="f">Cuota<input type="number" min="1" id="eCuota" value="' + esc(d.cuota) + '"></label><label class="f">Total de cuotas<input type="number" min="1" id="eTotal" value="' + esc(d.total) + '"></label>' : '') + '</div>';
    } else {
      d = d || { desc: mm.desc, amount: mm.amount, currency: mm.currency, startMonth: mm.startMonth, cuotas: !!mm.cuotaTotal, cuotaActual: mm.cuotaActual || '', cuotaTotal: mm.cuotaTotal || '', monthly: !!mm.monthly, splitWith: mm.splitWith || '' };
      body = '<div class="form-grid" id="eform">' + manualFields(d, 'ed') + '</div>';
    }
    openModal('<h2>' + esc(r.desc) + '</h2>' + body + '<p class="err small" id="eErr" hidden></p>' +
      '<div class="btns"><button class="btn" id="eSave">Guardar cambios</button><button class="btn ghost" id="eCancel">Cancelar</button></div>' +
      '<div id="eDel"><button class="btn danger small" id="eDelAsk">' + (isPdf ? 'Quitar este gasto' : 'Quitar este gasto a mano') + '</button></div>',
      function (root) {
        function collect() {
          if (isPdf && r.estimated) return { custom: $('#eCustom').value, splitWith: $('#eSplit').value };
          if (isPdf) return { custom: $('#eCustom').value, splitWith: $('#eSplit').value, amount: $('#eAmount').value, cuota: $('#eCuota') ? $('#eCuota').value : '', total: $('#eTotal') ? $('#eTotal').value : '' };
          return collectManual('ed', d);
        }
        root.addEventListener('change', function (ev) {
          if (ev.target.id === 'eSplit' || ev.target.id === 'edSplit') {
            if (ev.target.value === '__new') {
              var dr = collect(); dr.splitWith = '';
              contactModal(null, function (c) { if (c) dr.splitWith = c.id; rowModal(r, dr); });
            }
          } else if (!isPdf && (ev.target.id === 'edCuotas' || ev.target.id === 'edMonthly')) {
            rowModal(r, collect());
          }
        });
        root.querySelector('#eCancel').onclick = closeModal;
        root.querySelector('#eDelAsk').onclick = function () {
          $('#eDel').innerHTML = '<div class="alert bad"><span>' + (isPdf ? 'Se borra de todos los meses.' : 'Se borra el gasto y todos sus meses.') + ' ¿Seguro?</span><div class="btns"><button class="btn danger small" id="eDelYes">Sí, borrar</button><button class="btn ghost small" id="eDelNo">No</button></div></div>';
          $('#eDelYes').onclick = function () {
            if (isPdf) S.expenses = S.expenses.filter(function (x) { return x.id !== e.id; }); else S.manual = S.manual.filter(function (x) { return x.id !== mm.id; });
            save(); closeModal(); render(); toast('Gasto quitado');
          };
          $('#eDelNo').onclick = function () { rowModal(r, collect()); };
        };
        root.querySelector('#eSave').onclick = function () {
          var v = collect(), err = $('#eErr');
          if (isPdf && r.estimated) {
            e.custom = v.custom.trim(); e.splitWith = v.splitWith || null;
          } else if (isPdf) {
            var amt = parseFloat(String(v.amount).replace(',', '.'));
            if (isNaN(amt)) { err.textContent = 'El monto no es válido.'; err.hidden = false; return; }
            var en = e.entries[r.entryIdx];
            if (C.r2(amt) !== en.amount) logGen('cambió el monto de "' + r.desc + '" de ' + money(en.amount, r.currency) + ' a ' + money(C.r2(amt), r.currency));
            e.custom = v.custom.trim(); e.splitWith = v.splitWith || null; en.amount = C.r2(amt);
            if (e.kind === 'cuota') {
              var a = parseInt(v.cuota, 10), t = parseInt(v.total, 10);
              if (!(a > 0) || !(t > 0) || a > t) { err.textContent = 'Revisá las cuotas: la actual no puede pasar del total.'; err.hidden = false; return; }
              en.cuota = a; en.total = t;
              if (r.entryIdx === e.entries.length - 1) { e.key.total = t; e.status = a >= t ? 'terminado' : 'activo'; }
            }
          } else {
            var res = readManual(v);
            if (res.err) { err.textContent = res.err; err.hidden = false; return; }
            Object.assign(mm, res.m);
          }
          save(); closeModal(); render(); toast('Cambios guardados');
        };
      });
  }


  /* ---------- corrección rápida: cuota y monto ---------- */
  function quickModal(r) {
    var isPdf = r.source === 'pdf';
    var e = isPdf ? S.expenses.find(function (x) { return x.id === r.expenseId; }) : null;
    var mm = !isPdf ? S.manual.find(function (x) { return x.id === r.manualId; }) : null;
    var hasC = !!r.total;
    openModal('<h2>' + esc(r.desc) + '</h2><p class="meta">Corregí lo que no coincida. Queda anotado en Actividad.</p>' +
      '<div class="form-grid"><label class="f' + (hasC ? '' : ' wide') + '">Monto<input type="number" step="0.01" inputmode="decimal" id="qAmt" value="' + esc(r.amount) + '"></label>' +
      (hasC ? '<label class="f">Cuota<input type="number" min="1" inputmode="numeric" id="qCuota" value="' + esc(r.cuota) + '"></label><label class="f">Total de cuotas<input type="number" min="1" inputmode="numeric" id="qTotal" value="' + esc(r.total) + '"></label>' : '') + '</div>' +
      '<p class="err small" id="qErr" hidden></p><div class="btns"><button class="btn" id="qSave">Guardar</button><button class="btn ghost" id="qCancel">Cancelar</button></div>',
      function (root) {
        root.querySelector('#qCancel').onclick = closeModal;
        root.querySelector('#qSave').onclick = function () {
          var err = $('#qErr'), amt = parseFloat(String($('#qAmt').value).replace(',', '.'));
          var ca = hasC ? parseInt($('#qCuota').value, 10) : null, tt = hasC ? parseInt($('#qTotal').value, 10) : null;
          if (isNaN(amt) || amt < 0) { err.textContent = 'El monto no es válido.'; err.hidden = false; return; }
          if (hasC && (!(ca > 0) || !(tt > 0) || ca > tt)) { err.textContent = 'Revisá las cuotas: la actual no puede pasar del total.'; err.hidden = false; return; }
          amt = C.r2(amt);
          var ch = [];
          if (amt !== r.amount) ch.push('el monto de ' + money(r.amount, r.currency) + ' a ' + money(amt, r.currency));
          if (hasC && ca !== r.cuota) ch.push('la cuota de ' + r.cuota + ' a ' + ca);
          if (hasC && tt !== r.total) ch.push('el total de cuotas de ' + r.total + ' a ' + tt);
          if (!ch.length) { closeModal(); return; }
          var mon = cap(C.monthLabel(r.ym || ui.month));
          if (isPdf && r.estimated) {
            e.anchors = e.anchors || {}; e.anchors[r.ym] = { cuota: ca, total: tt, amount: amt };
          } else if (isPdf) {
            var en = e.entries[r.entryIdx]; en.amount = amt;
            if (hasC) { en.cuota = ca; en.total = tt; if (r.entryIdx === e.entries.length - 1) { e.key.total = tt; e.status = ca >= tt ? 'terminado' : 'activo'; } }
            if (e.groupId) {
              var gg = gOf(e.groupId), gx = gg && gg.expenses.find(function (x) { return x.src === e.id + ':' + en.stmtId; });
              if (gx && gx.amount !== amt) { logAct(gg, 'cambió el monto de "' + gx.desc + '" de ' + money(gx.amount, 'ARS') + ' a ' + money(amt, 'ARS') + ' (corrección desde el resumen de tarjeta)'); gx.amount = amt; }
            }
          } else {
            mm.amount = amt;
            if (hasC) { mm.cuotaActual = ca - C.monthDiff(mm.startMonth, r.ym || ui.month); mm.cuotaTotal = tt; }
          }
          logGen('cambió ' + ch.join(' y ') + ' de "' + r.desc + '" (' + mon + ')');
          save(); closeModal(); render(); toast('Cambios guardados');
        };
      });
  }

    };
  }

        var pg = gOf(ui.group), pid = el.getAttribute('data-id'), pp = pg && (pg.payments || []).find(function (x) { return x.id === pid; });
        if (!pp) break;
        var pdesc = C.userName(pp.from) + ' → ' + C.userName(pp.to) + ' ' + money(pp.amount, 'ARS');
        if (act === 'g-pconfirm') { pp.status = 'ok'; pp.ts = Date.now(); logAct(pg, 'confirmó el pago de ' + pdesc); toast('Pago confirmado'); }
        else { pg.payments = pg.payments.filter(function (x) { return x.id !== pid; }); logAct(pg, (act === 'g-preject' ? 'rechazó' : 'canceló') + ' el pago de ' + pdesc); toast(act === 'g-preject' ? 'Pago rechazado' : 'Pago cancelado'); }

      case 'g-settle':

        if (sg) groupPaymentModal(gg, null, { from: sg.from, to: sg.to, amount: sg.amount, date: today() }); break;
      case 'g-item':

        if (el.getAttribute('data-k') === 'e') groupExpenseModal(g2, g2.expenses.find(function (x) { return x.id === id2; }));
        else groupPaymentModal(g2, (g2.payments || []).find(function (x) { return x.id === id2; }));
        break;
      case 'mode': ui.mode = el.getAttribute('data-m'); render(); break;
      case 'filter': ui.filter = el.getAttribute('data-f'); render(); break;
      case 'open-row': var r = rowIndex[el.getAttribute('data-key')]; if (r) rowModal(r); break;
      case 'add-contact': contactModal(null); break;
      case 'edit-contact': contactModal(C.myContacts(S).find(function (c) { return c.id === el.getAttribute('data-id'); })); break;
      case 'who-set': S.whoami = el.getAttribute('data-id'); save(); ui.group = null; ui.from = null; toast('Probando como ' + C.userName(S.whoami)); render(); break;
      case 'save-alias': S.aliases = S.aliases || {}; var nal = $('#myAlias').value.trim(); if ((S.aliases[S.whoami] || '') !== nal) { S.aliases[S.whoami] = nal; logGen(nal ? 'cargó su alias para que le transfieran' : 'sacó su alias de transferencia'); } save(); toast('Alias guardado'); render(); break;
      case 'copy-alias': var av = el.getAttribute('data-v'); try { navigator.clipboard.writeText(av).then(function () { toast('Alias copiado: ' + av); }, function () { toast('Alias: ' + av); }); } catch (e1) { toast('Alias: ' + av); } break;
      case 'inv-contact':
        var iu = C.USERS.find(function (x) { return x.id === el.getAttribute('data-id'); }); if (!iu) break;
        var prev = C.myContacts(S).find(function (x) { return x.email.trim().toLowerCase() === iu.email; });
        if (prev) { delete prev.removed; } else S.contacts.push({ id: C.uid(), owner: S.whoami, alias: iu.name, email: iu.email });
        var pc = C.myContacts(S).find(function (x) { return x.email.trim().toLowerCase() === iu.email; }); C.requestFor(S, pc);
        logGen('invitó a ' + iu.name + ' a ser contacto'); save(); toast('Invitación enviada a ' + iu.name); render(); break;
      case 'req-ok': case 'req-no':
        var rq = (S.friendReqs || []).find(function (x) { return x.id === el.getAttribute('data-id'); }); if (!rq) break;
        var fu = C.USERS.find(function (x) { return x.id === rq.from; }), me2 = C.USERS.find(function (x) { return x.id === rq.to; });
        var theirs = S.contacts.find(function (x) { return (x.owner || 'u-fercho') === rq.from && x.email.trim().toLowerCase() === me2.email; });
        if (act === 'req-ok') {
          (S.friendReqs || []).forEach(function (x) { if (x.status === 'pending' && x.from === rq.from && x.to === rq.to) x.status = 'accepted'; });
          var mine2 = C.myContacts(S).find(function (x) { return x.email.trim().toLowerCase() === fu.email; });
          if (mine2) delete mine2.removed; else S.contacts.push({ id: C.uid(), owner: S.whoami, alias: fu.name, email: fu.email });
          if (theirs) delete theirs.removed;
          logGen('aceptó la solicitud de ' + fu.name + ': ahora son contactos'); toast('Ahora ' + fu.name + ' es tu contacto');
        } else {
          (S.friendReqs || []).forEach(function (x) { if (x.status === 'pending' && x.from === rq.from && x.to === rq.to) x.status = 'rejected'; });
          logGen('rechazó la solicitud de ' + fu.name); toast('Solicitud rechazada');
        }
        save(); render(); break;
      case 'reinvite': var ric = C.myContacts(S).find(function (x) { return x.id === el.getAttribute('data-id'); }); if (ric && C.requestFor(S, ric)) { logGen('volvió a mandar la solicitud de contacto a ' + ric.alias); toast('Solicitud enviada a ' + ric.alias); save(); render(); } break;
      case 'readd-contact': var rc = S.contacts.find(function (x) { return x.id === el.getAttribute('data-id'); }); if (rc) { delete rc.removed; logGen('volvió a agregar a ' + rc.alias + ' como contacto'); if (C.requestFor(S, rc)) { logGen('mandó solicitud de contacto a ' + rc.alias); toast('Le mandamos la solicitud a ' + rc.alias); } save(); render(); } break;
      case 'del-contact':
        var cid = el.getAttribute('data-id'), c = S.contacts.find(function (x) { return x.id === cid; });
        openModal('<h2>¿Quitar a ' + esc(c.alias) + '?</h2><p class="muted">No se borra nada: sus deudas y los gastos que dividías siguen a la vista con este nombre. Lo que se corta es la conexión en vivo con ella. Si la volvés a agregar con el mismo mail, se reconecta sola.</p><div class="btns"><button class="btn danger" id="dcYes">Sí, quitar</button><button class="btn ghost" id="dcNo">No</button></div>', function (root) {
          root.querySelector('#dcNo').onclick = closeModal;
          root.querySelector('#dcYes').onclick = function () {
            c.removed = Date.now(); delete c.invited;
            logGen('quitó a ' + c.alias + ' de sus contactos (las deudas siguen a la vista)');
            save(); closeModal(); render(); toast('Quedó en "Ya no son contactos"');
          };
        });
        break;
      case 'rv-ask': var ch = ui.reviews[ri].choices[ii] || (ui.reviews[ri].choices[ii] = {}); ch.acceptSuggest = el.getAttribute('data-v') === 'si'; delete ch.custom; delete ch.splitWith; render(); break;
      case 'rv-save': saveReview(ri); break;
      case 'rv-discard': ui.reviews.splice(ri, 1); render(); break;
      case 'manual-save':
        var d = ui.mdraft, res = readManual(d);
        if (res.err) { var eb = $('#mErr'); eb.textContent = res.err; eb.hidden = false; break; }
        if (S.demo) S = C.emptyState();
        res.m.id = C.uid(); S.manual.push(res.m); save(); ui.mdraft = null; ui.month = res.m.startMonth; toast('Gasto guardado'); setTab('gastos'); break;
      case 'copy-backup': copyBackup(); break;
      case 'demo-on': S = C.demoState(); save(); ui.group = null; ui.month = '2026-11'; setTab(ui.tab === 'pruebas' ? 'pruebas' : 'inicio'); break;
      case 'wipe-demo': S = C.emptyState(); save(); ui.group = null; ui.month = null; ui.reviews = []; render(); break;
      case 'wipe-ask':
        var wb = $('#wipeBox'); wb.hidden = false;
        wb.innerHTML = 'Se borran los resúmenes, los gastos y los contactos de este navegador. <span class="btns" style="margin-top:8px"><button class="btn danger small" data-act="wipe-yes">Sí, borrar todo</button><button class="btn ghost small" data-act="wipe-no">No</button></span>';
        break;
      case 'wipe-yes': S = C.emptyState(); save(); ui.group = null; ui.month = null; ui.reviews = []; ui.mdraft = null; toast('Todo borrado'); render(); break;
      case 'wipe-no': $('#wipeBox').hidden = true; break;
    }
  });

  document.addEventListener('input', function (ev) {
    var t = ev.target;
    if (t.classList.contains('rv-custom')) { var rv = ui.reviews[+t.getAttribute('data-ri')], i = +t.getAttribute('data-ii'); (rv.choices[i] || (rv.choices[i] = {})).custom = t.value; }
    else if (t.id === 'gq') { ui.q = t.value; $('#glist').innerHTML = glistHTML(); }
    else if (t.closest('#mform') && t.getAttribute('data-d')) { ui.mdraft[t.getAttribute('data-d')] = t.type === 'checkbox' ? t.checked : t.value; }
  });

  document.addEventListener('change', function (ev) {
    var t = ev.target;
    if (t.id === 'monthSel') { ui.hist = t.value; render(); return; }
    if (t.id === 'whoami') { S.whoami = t.value; save(); ui.group = null; render(); return; }
    if (t.id === 'pdfFile') { handleFiles(t.files); t.value = ''; return; }
    if (t.id === 'bkFile') {
      var f = t.files[0]; if (!f) return;
      f.text().then(function (txt) {
        try { var o = JSON.parse(txt); if (!o || o.v !== 1 || !Array.isArray(o.expenses)) throw new Error('x'); S = norm(o); save(); ui.month = null; ui.group = null; render(); toast('Respaldo cargado'); }
        catch (e) { toast('Ese archivo no es un respaldo válido'); }
      });
      t.value = ''; return;
    }
    if (t.classList.contains('rv-year')) { reparse(+t.getAttribute('data-ri'), +t.value); return; }
    if (t.classList.contains('rv-split')) {
      var rvi = +t.getAttribute('data-ri'), ii = +t.getAttribute('data-ii'), rv = ui.reviews[rvi];
      if (t.value === '__new') { contactModal(null, function (c) { if (c) (rv.choices[ii] || (rv.choices[ii] = {})).splitWith = c.id; render(); }); return; }
      var chs = rv.choices[ii] || (rv.choices[ii] = {}); chs.splitWith = t.value || null; chs.groupId = ''; render(); return;
    }
    if (t.classList.contains('rv-group')) { (ui.reviews[+t.getAttribute('data-ri')].choices[+t.getAttribute('data-ii')] || (ui.reviews[+t.getAttribute('data-ri')].choices[+t.getAttribute('data-ii')] = {})).groupId = t.value; return; }
    if (t.closest('#mform') && t.getAttribute('data-d')) {
      var k = t.getAttribute('data-d');
      if (k === 'splitWith' && t.value === '__new') { ui.mdraft.splitWith = ''; contactModal(null, function (c) { if (c) ui.mdraft.splitWith = c.id; render(); }); return; }
      ui.mdraft[k] = t.type === 'checkbox' ? t.checked : t.value;
      if (k === 'cuotas' || k === 'monthly') render();
    }
  });

  /* arrastrar y soltar */
  document.addEventListener('dragover', function (ev) { var dz = ev.target.closest && ev.target.closest('#dz'); if (dz) { ev.preventDefault(); dz.classList.add('over'); } });
  document.addEventListener('dragleave', function (ev) { var dz = ev.target.closest && ev.target.closest('#dz'); if (dz) dz.classList.remove('over'); });
  document.addEventListener('drop', function (ev) { var dz = ev.target.closest && ev.target.closest('#dz'); if (dz) { ev.preventDefault(); dz.classList.remove('over'); handleFiles(ev.dataTransfer.files); } });

  window.addEventListener('hashchange', function () { var h = location.hash.slice(1); if (ALL_TABS.some(function (t) { return t[0] === h; }) && h !== ui.tab) setTab(h, false); });
  var h0 = location.hash.slice(1); if (ALL_TABS.some(function (t) { return t[0] === h0; })) ui.tab = h0;
  render();
})();

</script>
